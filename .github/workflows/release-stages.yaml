name: Release Stage (Comment Trigger)

on:
  issue_comment:
    types: [created]

jobs:
  release-stage:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/stage') &&
      github.repository == 'giantswarm/releases' &&
      (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # members: read is an organization permission, so owner is set. It
          # lets the job resolve the teams it requests as reviewers.
          owner: giantswarm
          repositories: releases
          permission-pull-requests: write
          permission-issues: write
          permission-members: read

      - name: Add reaction to comment to indicate processing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: 'eyes'
            })

      - name: Get PR details
        id: pr_details
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.issue.number }}
            });
            if (pr.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Pull requests from forks are not supported.');
            }

            const labels = pr.data.labels.map(l => l.name);
            const branch = pr.data.head.ref;
            const title = pr.data.title;
            const prUrl = pr.data.html_url;
            const body = pr.data.body || '';

            core.setOutput('labels', JSON.stringify(labels));
            core.setOutput('branch', branch);
            core.setOutput('title', title);
            core.setOutput('pr_url', prUrl);
            core.setOutput('body', body);

      - name: Parse and validate stage transition
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_LABELS: ${{ steps.pr_details.outputs.labels }}
          PR_BRANCH: ${{ steps.pr_details.outputs.branch }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commentBody = context.payload.comment.body.trim();
            const labels = JSON.parse(process.env.PR_LABELS);
            const branch = process.env.PR_BRANCH;

            // Parse target stage from comment
            const match = commentBody.match(/^\/stage\s+(active|freeze)(\s+--skip-tests)?\s*$/);
            if (!match) {
              core.setOutput('error', 'Invalid command. Usage: `/stage active [--skip-tests]` or `/stage freeze`');
              return;
            }

            const targetStage = match[1];
            const skipTests = Boolean(match[2]);

            if (skipTests && targetStage !== 'active') {
              core.setOutput('error', 'The `--skip-tests` flag is only valid with `/stage active`.');
              return;
            }

            core.setOutput('target_stage', targetStage);
            core.setOutput('skip_tests', skipTests.toString());

            // Determine current stage from labels
            let currentStage = 'none';
            if (labels.includes('stage/freeze')) {
              currentStage = 'freeze';
            } else if (labels.includes('stage/active')) {
              currentStage = 'active';
            } else if (labels.includes('stage/development')) {
              currentStage = 'development';
            }
            core.setOutput('current_stage', currentStage);

            // Validate transition
            const validTransitions = {
              'development': ['active'],
              'active': ['freeze'],
              'none': ['active']
            };

            const allowed = validTransitions[currentStage] || [];
            if (!allowed.includes(targetStage)) {
              let errorMsg = `Cannot transition from **${currentStage}** to **${targetStage}**.\\n\\nValid transitions:\\n`;
              errorMsg += '- `development` -> `active`\\n';
              errorMsg += '- `active` -> `freeze`\\n';
              errorMsg += '- `none` -> `active` (legacy PRs)';
              core.setOutput('error', errorMsg);
              return;
            }

            // Determine if this is a consolidated release (branch pattern: release-vX.Y.Z without provider suffix)
            const isConsolidated = /^release-v\d+\.\d+\.\d+$/.test(branch);
            core.setOutput('is_consolidated', isConsolidated.toString());

            // Extract version from branch
            const versionMatch = branch.match(/release-(v\d+\.\d+\.\d+)/);
            const version = versionMatch ? versionMatch[1] : '';
            core.setOutput('version', version);

            core.setOutput('valid', 'true');

      - name: Post error if validation failed
        if: steps.validate.outputs.error
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const error = `${{ steps.validate.outputs.error }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: `**Stage Transition Failed**\n\n${error}`
            });

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: '-1'
            });

      - name: Checkout code
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.target_stage == 'active'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get provider lists
        id: providers
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.target_stage == 'active' && steps.validate.outputs.skip_tests != 'true'
        uses: ./.github/actions/get-providers

      # All E2E test suites must have run once (and passed or been waived) while the
      # release is still in Development. The transition to Active is gated on that;
      # /stage active --skip-tests bypasses the gate. See giantswarm/roadmap#4440.
      - name: Evaluate E2E coverage gate
        id: coverage
        if: steps.validate.outputs.valid == 'true' && steps.validate.outputs.target_stage == 'active' && steps.validate.outputs.skip_tests != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPI_NAMES: ${{ steps.providers.outputs.capi_names }}
          SKIP_PUBLISH: 'true'
        run: node .github/scripts/e2e-coverage.js

      - name: Decide whether the transition proceeds
        id: decision
        if: steps.validate.outputs.valid == 'true'
        env:
          TARGET_STAGE: ${{ steps.validate.outputs.target_stage }}
          SKIP_TESTS: ${{ steps.validate.outputs.skip_tests }}
          COVERAGE_COMPLETE: ${{ steps.coverage.outputs.complete }}
        run: |
          if [[ "$TARGET_STAGE" != "active" || "$SKIP_TESTS" == "true" || "$COVERAGE_COMPLETE" == "true" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger suites that have not run yet
        if: steps.decision.outputs.proceed == 'false' && steps.coverage.outputs.not_run_suites != ''
        uses: ./.github/actions/trigger-e2e-tests
        with:
          pr_number: ${{ github.event.issue.number }}
          github_token: ${{ steps.app-token.outputs.token }}
          target_suites: ${{ steps.coverage.outputs.not_run_suites }}

      - name: Post blocked-transition comment
        if: steps.decision.outputs.proceed == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const notRun = '${{ steps.coverage.outputs.not_run_suites }}'.split(',').filter(Boolean);
            const failed = '${{ steps.coverage.outputs.failed_suites }}'.split(',').filter(Boolean);
            const inProgress = '${{ steps.coverage.outputs.in_progress_suites }}'.split(',').filter(Boolean);

            const list = (suites) => suites.map(s => `\`${s}\``).join(', ');

            let body = '**Stage transition to `active` blocked**\n\n';
            body += 'Every E2E test suite must have run once (and passed or been waived) before the release moves to Active, so all flavours are validated during Development.\n\n';
            if (notRun.length > 0) {
              body += `- 🚀 Not run yet — **triggered now**: ${list(notRun)}\n`;
            }
            if (inProgress.length > 0) {
              body += `- 🚧 Still in progress: ${list(inProgress)}\n`;
            }
            if (failed.length > 0) {
              body += `- ❌ Failed: ${list(failed)} — fix and re-run with \`/run releases-test-suites TARGET_SUITES=${failed.join(',')}\`, or waive with \`/waive-suite <provider>/<suite> <reason>\`\n`;
            }
            body += '\nRe-run `/stage active` once the `E2E Coverage` check is green, or use `/stage active --skip-tests` to switch without the gate.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: body
            });

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: '-1'
            });

      - name: Swap stage labels
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const currentStage = '${{ steps.validate.outputs.current_stage }}';
            const targetStage = '${{ steps.validate.outputs.target_stage }}';
            const prNumber = ${{ github.event.issue.number }};

            // Remove current stage label if present
            if (currentStage !== 'none') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: `stage/${currentStage}`
                });
              } catch (e) {
                console.log(`Label stage/${currentStage} not found, skipping removal`);
              }
            }

            // Add new stage label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [`stage/${targetStage}`]
            });

      - name: Request reviewers on active stage
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true' && steps.validate.outputs.target_stage == 'active'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const teams = ['team-rocket', 'team-phoenix', 'team-shield', 'team-atlas'];

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ${{ github.event.issue.number }},
                team_reviewers: teams
              });
              console.log(`Requested reviews from: ${teams.join(', ')}`);
            } catch (e) {
              console.log(`Warning: Could not request all team reviewers: ${e.message}`);
            }

      - name: Send Slack notification
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true' && steps.validate.outputs.is_consolidated == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          PR_URL: ${{ steps.pr_details.outputs.pr_url }}
          PR_TITLE: ${{ steps.pr_details.outputs.title }}
        run: |
          # Skip if Slack is not configured
          if [[ -z "$SLACK_BOT_TOKEN" ]] || [[ -z "$SLACK_CHANNEL_ID" ]]; then
            echo "Slack is not configured. Skipping notification."
            exit 0
          fi

          TARGET_STAGE="${{ steps.validate.outputs.target_stage }}"
          VERSION="${{ steps.validate.outputs.version }}"

          if [[ "$TARGET_STAGE" == "active" ]]; then
            SLACK_TITLE="Release ${VERSION} — Active Review"
            SLACK_BODY="Release ${VERSION} PR is now in stage: *Active Review*. Product teams can now review, bump components, and run tests.\n\n*Release PR:* <${PR_URL}|${PR_TITLE}>"
            HELP_BLOCK='{
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": ":book: *Need help adding changes?*\nCheck out the <https://intranet.giantswarm.io/docs/product/releases/capi/capi-release-drafting/|CAPI Release Drafting Guide> for detailed instructions on how to update releases."
              }
            }'
          elif [[ "$TARGET_STAGE" == "freeze" ]]; then
            SLACK_TITLE="Release ${VERSION} — Freeze"
            SLACK_BODY="Release ${VERSION} PR is now in stage: *Freeze*. Only bugfixes and critical patches are allowed.\n\n*Release PR:* <${PR_URL}|${PR_TITLE}>"
            HELP_BLOCK=""
          fi

          # Build blocks array
          BLOCKS='[
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "'"$SLACK_TITLE"'",
                "emoji": true
              }
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "'"$SLACK_BODY"'"
              }
            }'

          if [[ -n "$HELP_BLOCK" ]]; then
            BLOCKS="${BLOCKS},${HELP_BLOCK}"
          fi

          BLOCKS="${BLOCKS}]"

          # Send to Slack using Bot Token
          echo "Sending stage notification to Slack"
          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\": \"$SLACK_CHANNEL_ID\", \"blocks\": $BLOCKS, \"metadata\": {\"event_type\": \"release_stage_change\", \"event_payload\": {\"version\": \"$VERSION\", \"stage\": \"$TARGET_STAGE\"}}}")

          echo "Slack response: $(echo "$RESPONSE" | jq -r '.ok')"

      - name: Update PR body stage dashboard
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const targetStage = '${{ steps.validate.outputs.target_stage }}';
            const body = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.issue.number }}
            }).then(r => r.data.body || '');

            const stages = ['Development', 'Active', 'Freeze', 'Release & Publish'];
            const stageMap = {
              'active': 1,
              'freeze': 2
            };

            const activeIndex = stageMap[targetStage] ?? 0;

            let dashboard = '<!-- STAGE_DASHBOARD_START -->\n';
            dashboard += '| Stage | Status |\n';
            dashboard += '|-------|--------|\n';

            stages.forEach((stage, i) => {
              if (i < activeIndex) {
                dashboard += `| ${stage} | :white_check_mark: Done |\n`;
              } else if (i === activeIndex) {
                dashboard += `| ${stage} | :arrow_right: Current |\n`;
              } else {
                dashboard += `| ${stage} | :hourglass: Pending |\n`;
              }
            });

            const stageNotes = {
              'active': '🟢 **Active stage:** product teams can review, bump components with `/update-release`, run tests and add changes.',
              'freeze': '🔒 **Freeze stage:** only Team Tenet can change this release. `/update-release` from other teams is rejected.'
            };
            dashboard += `\n${stageNotes[targetStage]}\n`;
            dashboard += '<!-- STAGE_DASHBOARD_END -->';

            let newBody;
            if (body.includes('<!-- STAGE_DASHBOARD_START -->') && body.includes('<!-- STAGE_DASHBOARD_END -->')) {
              newBody = body.replace(
                /<!-- STAGE_DASHBOARD_START -->[\s\S]*?<!-- STAGE_DASHBOARD_END -->/,
                dashboard
              );
            } else {
              // Insert before the instructions section if possible
              newBody = body;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.issue.number }},
              body: newBody
            });

      - name: Add success reaction
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ github.event.comment.id }},
              content: '+1'
            })

      - name: Trigger /summarize-ai on freeze
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true' && steps.validate.outputs.target_stage == 'freeze'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: '/summarize-ai'
            });

      - name: Post summary comment
        if: steps.validate.outputs.valid == 'true' && steps.decision.outputs.proceed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const targetStage = '${{ steps.validate.outputs.target_stage }}';
            const version = '${{ steps.validate.outputs.version }}';
            const isConsolidated = '${{ steps.validate.outputs.is_consolidated }}' === 'true';
            const skipTests = '${{ steps.validate.outputs.skip_tests }}' === 'true';

            let body = `**Release stage changed to \`${targetStage}\`**\n\n`;

            if (targetStage === 'active') {
              body += `Release ${version} is now in the **Active** stage.\n\n`;
              body += `- Product teams have been requested as reviewers\n`;
              body += `- Teams can now bump components, run tests, and add changes\n`;
              if (skipTests) {
                body += `- The E2E coverage gate was **skipped** (\`--skip-tests\`)\n`;
              } else {
                body += `- All expected E2E test suites have run (passed or waived) during Development\n`;
              }
              if (isConsolidated) {
                body += `- A Slack notification has been sent to the release channel\n`;
              }
            } else if (targetStage === 'freeze') {
              body += `Release ${version} has entered **Freeze**.\n\n`;
              body += `- Only Team Tenet members can make changes\n`;
              body += `- Other changes will be rejected by the update workflow\n`;
              if (isConsolidated) {
                body += `- A Slack notification has been sent to the release channel\n`;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: body
            });
