name: 'Trigger e2e tests'
description: 'Triggers the e2e tests by commenting on the PR'
inputs:
  pr_number:
    description: 'The number of the pull request to comment on'
    required: true
  github_token:
    description: 'The GitHub token to use for authentication'
    required: true
  target_suites:
    description: 'Optional comma-separated list of test suites to run (e.g. ./providers/capa/standard). Overrides stage-based suite selection.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Trigger e2e tests
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const targetSuites = `${{ inputs.target_suites }}`.trim();
          let body = '/run releases-test-suites';
          if (targetSuites !== '') {
            body += ` TARGET_SUITES=${targetSuites}`;
          }
          github.rest.issues.createComment({
            issue_number: ${{ inputs.pr_number }},
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          })
